spring.application.name=withJta
server.servlet.context-path=/withJta
server.port=8181

spring.profiles.active=jta

#jdbc (non jta) properties ignored with "jta" active profile
#maria_db = version simplifiee de mySql (compatible)
#spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/product_customer_order_db?createDatabaseIfNotExist=true&serverTimezone=UTC
#spring.datasource.url=jdbc:mysql://localhost:3306/product_customer_order_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

#create in early-dev , none + flyway in dev and prod
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.hibernate.show_sql=true

#proprietees temporaires , avec erreurs temporaires eventuelles (juste pour inspirations pour scripts flyway):
#spring.jpa.properties.javax.persistence.schema-generation.scripts.action=drop-and-create
#spring.jpa.properties.javax.persistence.schema-generation.scripts.create-target=src/main/resources/temp/create.sql
#spring.jpa.properties.javax.persistence.schema-generation.scripts.drop-target=src/main/resources/temp/drop.sql
