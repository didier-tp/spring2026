

#FATAL,ERROR,WARN,INFO,DEBUG,TRACE
logging.level.root=INFO
logging.level.org.springframework=ERROR
logging.level.tp.appliSpring=DEBUG

#parametres de connexions a serveur mariaDB (mysql open source) avec access root/root autorise
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/bankDB?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

#en V1 (sans flyway) , spring.jpa.hibernate.ddl-auto=create pour
# recreer les tables a vide selon structure classe java a chaque redemmarrage du main() ou d'un test
spring.jpa.hibernate.ddl-auto=create

